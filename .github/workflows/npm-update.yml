name: npm update

# Weekly batch of npm dependency updates, from mikelward/npm-update.
on:
  schedule:
    # 06:17 UTC on Saturdays: an off-the-hour minute, since the top of the
    # hour is the busiest slot on the shared scheduler.
    - cron: '17 6 * * 6'
  workflow_dispatch:

permissions: {}

jobs:
  npm-update:
    uses: mikelward/npm-update/.github/workflows/npm-update.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # `inherit`, not a `secrets:` block naming NPM_UPDATE_PAT: the publish
    # job reads the credential from this repository's `npm-update`
    # environment, and an environment secret reaches a called workflow no
    # other way. A secret passed by name reaches the runner of every job in
    # the called workflow, the untrusted update job included -- see
    # mikelward/npm-update's README. The credential opens the batch PR as a
    # real collaborator rather than as `GITHUB_TOKEN`, so the ordinary
    # `pull_request` round runs for it, every required check included. The
    # matching zizmor finding (secrets-inherit) is allowed for this file in
    # .github/zizmor.yml, with the same reason.
    secrets: inherit
