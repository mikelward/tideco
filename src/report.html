<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tide: report a bug</title>
<link rel="icon" href="../icons/tide-32.png">
<link rel="stylesheet" href="options.css">
<link rel="stylesheet" href="report.css">
<script type="module" src="reportview.js"></script>
</head>
<body>
<main>
<h1>Report a bug</h1>
<p id="status" role="status"></p>
<p class="muted">It may show app names and window titles. Nothing is sent until you submit the issue.</p>
<div id="errors" role="alert" hidden></div>
<div class="row">
<button id="copy" type="button">Copy and open the issue page</button>
<button id="save" type="button">Save as a file</button>
</div>
<textarea id="text" readonly spellcheck="false" aria-label="The report"></textarea>
</main>
</body>
</html>
